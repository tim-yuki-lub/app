<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app</title>
<style>
  :root { --bg:#fafafa; --fg:#1b1b1f; --card:#fff; --line:#e4e4e8; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111216; --fg:#ececf1; --card:#1b1c22; --line:#2a2b33; --accent:#8b86ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; padding:32px 16px; }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 16px; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-decoration:none; color:inherit; margin-bottom:12px; }
  a.card strong { display:block; font-size:17px; margin-bottom:4px; }
  a.card span { color:#777; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>アプリ一覧</h1>
  <a class="card" href="./shitaku/"><strong>明日の支度</strong><span>出発時刻から、今夜の流れを逆算する</span></a>
</main>
</body>
</html>
